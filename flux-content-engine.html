<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root {
  --bg-deep:      #080e18;
  --bg-dark:      #0d1521;
  --bg-card:      #111927;
  --border:       rgba(255,255,255,0.08);
  --border-mid:   rgba(255,255,255,0.12);
  --primary:      #ffffff;
  --secondary:    #9aa3ae;
  --muted:        rgba(255,255,255,0.45);
  --accent-mint:  #cdffd8;
  --accent-blue:  #94b9ff;
  --grad:         linear-gradient(135deg, #cdffd8, #94b9ff);
  --error:        #ff6b6b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--bg-deep);
  color: var(--primary);
}

/* ── APP SHELL ── */
.app { display: flex; height: 100vh; overflow: hidden; }

/* ── SIDEBAR ── */
.sidebar {
  width: 260px;
  background: var(--bg-dark);
  border-right: 1px solid var(--border);
  padding: 20px 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

.logo { padding: 0 16px 28px; }

.logo-text {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--primary);
  line-height: 1.3;
}

.logo-sub {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 6px;
}

.nav { flex: 1; padding: 0 10px; display: flex; flex-direction: column; gap: 2px; }

.nav-item {
  padding: 11px 14px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--secondary);
  border: none;
  background: transparent;
  transition: all 0.2s;
  font-family: inherit;
  text-align: left;
  width: 100%;
}
.nav-item:hover { color: var(--primary); background: rgba(255,255,255,0.04); }
.nav-item.active {
  background: rgba(205,255,216,0.08);
  color: var(--accent-mint);
  font-weight: 600;
  border-left: 2px solid var(--accent-mint);
  padding-left: 12px;
}

.sidebar-footer {
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  gap: 6px;
}
.sidebar-footer button {
  flex: 1;
  padding: 9px;
  font-size: 11px;
  font-weight: 600;
  font-family: inherit;
  letter-spacing: 0.06em;
  background: transparent;
  color: var(--secondary);
  border: 1px solid var(--border-mid);
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s;
}
.sidebar-footer button:hover {
  border-color: rgba(205,255,216,0.3);
  color: var(--accent-mint);
}

/* ── MAIN ── */
.main { flex: 1; overflow-y: auto; padding: 32px; max-width: 1200px; }

.header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }

.h1 {
  font-family: 'DM Serif Display', serif;
  font-size: 28px;
  font-weight: 400;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  margin: 0;
}

/* ── LANG TOGGLE ── */
.lang-toggle { display: flex; gap: 6px; }
.lang-btn {
  padding: 7px 13px;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--secondary);
  border-radius: 999px;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  font-family: inherit;
  transition: all 0.2s;
}
.lang-btn:hover { color: var(--primary); border-color: rgba(255,255,255,0.2); }
.lang-btn.active {
  background: var(--grad);
  color: #0d1521;
  border-color: transparent;
}

/* ── FORM ── */
.form-group { margin-bottom: 18px; }

.label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
}

input, select, textarea {
  width: 100%;
  padding: 11px 14px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
  background: var(--bg-card);
  color: var(--primary);
  outline: none;
  transition: border-color 0.2s;
}
input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.2); }
input:focus, select:focus, textarea:focus { border-color: rgba(205,255,216,0.35); }
select option { background: var(--bg-dark); color: var(--primary); }

/* ── PLATFORM GRID (E3) ── */
.platform-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 8px;
  margin-bottom: 16px;
}
.platform-btn {
  padding: 12px 6px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  border-radius: 10px;
  cursor: pointer;
  text-align: center;
  font-size: 11px;
  font-weight: 500;
  font-family: inherit;
  color: var(--secondary);
  transition: all 0.2s;
  line-height: 1.3;
}
.platform-btn:hover {
  border-color: var(--border-mid);
  color: var(--primary);
}
.platform-btn.active {
  border-color: var(--accent-mint);
  background: rgba(205,255,216,0.08);
  color: var(--accent-mint);
  font-weight: 600;
}


/* ── PRIMARY BUTTON ── */
.button {
  padding: 13px 24px;
  background: var(--grad);
  color: #0d1521;
  border: none;
  border-radius: 999px;
  cursor: pointer;
  font-weight: 700;
  font-size: 13px;
  font-family: inherit;
  letter-spacing: 0.06em;
  transition: opacity 0.2s;
}
.button:hover { opacity: 0.85; }

/* ── CARDS ── */
.card {
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  margin-bottom: 12px;
}

.variation-card {
  padding: 18px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.variation-card:hover { border-color: var(--border-mid); }

.variation-title {
  font-weight: 600;
  font-size: 12px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
}

.variation-content {
  white-space: pre-wrap;
  font-size: 14px;
  color: var(--primary);
  margin-bottom: 14px;
  line-height: 1.7;
}

/* ── STAR RATING ── */
.rating { display: flex; gap: 4px; margin-top: 8px; }
.star { font-size: 20px; cursor: pointer; color: rgba(255,255,255,0.15); transition: color 0.15s; }
.star:hover { color: var(--accent-mint); }
.star.active { color: var(--accent-mint); }

/* ── SECTIONS ── */
.section { display: none; }
.section.active { display: block; }

/* ── DASHBOARD ── */
.dashboard-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
.stat-card {
  padding: 20px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg-card);
}
.stat-number {
  font-family: 'DM Serif Display', serif;
  font-size: 36px;
  font-weight: 400;
  background: var(--grad);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}
.stat-label { font-size: 12px; color: var(--secondary); margin-top: 6px; letter-spacing: 0.04em; }

.best-badge {
  margin-top: 10px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--accent-mint);
  text-transform: uppercase;
}

.generated-title {
  font-family: 'DM Serif Display', serif;
  font-size: 20px;
  font-weight: 400;
  color: var(--primary);
  margin-bottom: 16px;
}


/* ── E6: AUDIENCE TAG CHIPS ── */
.tag-section { margin-bottom: 14px; }
.tag-section-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
  display: block;
}
.tag-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.tag-chip {
  padding: 6px 12px;
  border: 1px solid var(--border-mid);
  background: transparent;
  color: var(--secondary);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
}
.tag-chip:hover {
  border-color: rgba(205,255,216,0.3);
  color: var(--primary);
}
.tag-chip.selected {
  background: rgba(205,255,216,0.12);
  border-color: var(--accent-mint);
  color: var(--accent-mint);
  font-weight: 600;
}
.audience-summary {
  margin-top: 10px;
  padding: 10px 14px;
  background: var(--bg-dark);
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 12px;
  color: var(--secondary);
  line-height: 1.5;
  display: none;
}
.audience-summary.visible { display: block; }

/* API key input override */
#apiKey { letter-spacing: 0.04em; }
</style>
</head>
<body>

<div class="app">
  <div class="sidebar">
    <div class="logo">
      <div class="logo-text">Flux Strategy</div>
      <div class="logo-sub">Content Engine</div>
    </div>
    <div class="nav">
      <button class="nav-item active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="nav-item" onclick="switchTab('clients')">Client Management</button>
      <button class="nav-item" onclick="switchTab('discover')">Topics</button>
      <button class="nav-item" onclick="switchTab('generate')">Generate</button>
      <button class="nav-item" onclick="switchTab('history')">History</button>
    </div>
    <div class="sidebar-footer">
      <button onclick="exportData()">Backup</button>
      <button onclick="importData()">Import</button>
    </div>
  </div>

  <div class="main">
    <div class="header">
      <h1 class="h1" id="pageTitle">Dashboard</h1>
      <div class="lang-toggle">
        <button class="lang-btn active" onclick="setLanguage('tc')">繁</button>
        <button class="lang-btn" onclick="setLanguage('sc')">简</button>
        <button class="lang-btn" onclick="setLanguage('en')">EN</button>
      </div>
    </div>

    <div class="section active" id="dashboard">
      <div class="dashboard-grid">
        <div class="stat-card">
          <div class="stat-number" id="clientCount">0</div>
          <div class="stat-label">Clients</div>
        </div>
        <div class="stat-card">
          <div class="stat-number" id="contentCount">0</div>
          <div class="stat-label">Content Items</div>
        </div>
      </div>
    </div>

    <div class="section" id="clients">
      <div class="form-group">
        <label class="label" data-key="clientName" data-required="true">Client Name *</label>
        <input type="text" id="clientName" placeholder="Enter client name...">
      </div>
      <div class="form-group">
        <label class="label" data-key="industry">Industry</label>
        <select id="clientIndustry">
          <option value="">Select industry...</option>
          <option value="beauty">Beauty & Personal Care (美容護膚)</option>
          <option value="fashion">Fashion & Apparel (時尚服裝)</option>
          <option value="food">Food & Beverage (食品飲料)</option>
          <option value="technology">Technology (科技)</option>
          <option value="finance">Finance & Banking (金融)</option>
          <option value="health">Health & Wellness (健康)</option>
          <option value="realestate">Real Estate (房地產)</option>
          <option value="travel">Travel & Tourism (旅遊)</option>
          <option value="education">Education (教育)</option>
          <option value="entertainment">Entertainment (娛樂)</option>
          <option value="ecommerce">E-commerce (電商)</option>
          <option value="luxury">Luxury Goods (奢侈品)</option>
          <option value="automotive">Automotive (汽車)</option>
          <option value="fitness">Fitness & Sports (運動健身)</option>
          <option value="home">Home & Living (家居生活)</option>
          <option value="other">Other (其他)</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label" data-key="brandTone" data-required="true">Brand Tone *</label>
        <select id="clientTone">
          <option value="professional" data-langkey="tone_professional">Professional</option>
          <option value="casual" data-langkey="tone_casual">Casual</option>
          <option value="luxury" data-langkey="tone_luxury">Luxury</option>
          <option value="energetic" data-langkey="tone_energetic">Energetic</option>
        </select>
      </div>
      <div class="form-group">
        <label class="label" data-key="brandStory">Brand Story</label>
        <textarea id="clientBrandStory" placeholder="Brand background, mission, values..." style="min-height: 80px; resize: vertical;"></textarea>
      </div>
      <div class="form-group">
        <label class="label" data-key="targetAudience">Target Audience</label>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="gender_label">Gender</span>
          <div class="tag-chips" id="chips-gender">
            <button class="tag-chip" data-group="gender" data-val="女性為主" data-langkey="chip_female" onclick="toggleChip(this)">女性為主</button>
            <button class="tag-chip" data-group="gender" data-val="男性為主" data-langkey="chip_male" onclick="toggleChip(this)">男性為主</button>
            <button class="tag-chip" data-group="gender" data-val="性別均衡" data-langkey="chip_balanced" onclick="toggleChip(this)">性別均衡</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="age_label">Age Group</span>
          <div class="tag-chips" id="chips-age">
            <button class="tag-chip" data-group="age" data-val="18-24歲" data-langkey="chip_18" onclick="toggleChip(this)">18-24</button>
            <button class="tag-chip" data-group="age" data-val="25-34歲" data-langkey="chip_25" onclick="toggleChip(this)">25-34</button>
            <button class="tag-chip" data-group="age" data-val="35-44歲" data-langkey="chip_35" onclick="toggleChip(this)">35-44</button>
            <button class="tag-chip" data-group="age" data-val="45-54歲" data-langkey="chip_45" onclick="toggleChip(this)">45-54</button>
            <button class="tag-chip" data-group="age" data-val="55歲以上" data-langkey="chip_55" onclick="toggleChip(this)">55+</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="lifestage_label">Life Stage</span>
          <div class="tag-chips" id="chips-lifestage">
            <button class="tag-chip" data-group="lifestage" data-val="學生" data-langkey="chip_student" onclick="toggleChip(this)">學生</button>
            <button class="tag-chip" data-group="lifestage" data-val="初入職場" data-langkey="chip_newjob" onclick="toggleChip(this)">初入職場</button>
            <button class="tag-chip" data-group="lifestage" data-val="專業人士" data-langkey="chip_pro" onclick="toggleChip(this)">專業人士</button>
            <button class="tag-chip" data-group="lifestage" data-val="新婚" data-langkey="chip_married" onclick="toggleChip(this)">新婚</button>
            <button class="tag-chip" data-group="lifestage" data-val="為人父母" data-langkey="chip_parent" onclick="toggleChip(this)">為人父母</button>
            <button class="tag-chip" data-group="lifestage" data-val="退休準備" data-langkey="chip_retire" onclick="toggleChip(this)">退休準備</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="income_label">Income Level</span>
          <div class="tag-chips" id="chips-income">
            <button class="tag-chip" data-group="income" data-val="大眾消費" data-langkey="chip_mass" onclick="toggleChip(this)">大眾消費</button>
            <button class="tag-chip" data-group="income" data-val="中產" data-langkey="chip_midclass" onclick="toggleChip(this)">中產</button>
            <button class="tag-chip" data-group="income" data-val="高收入" data-langkey="chip_high" onclick="toggleChip(this)">高收入</button>
            <button class="tag-chip" data-group="income" data-val="超高淨值" data-langkey="chip_uhnw" onclick="toggleChip(this)">超高淨值</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="interests_label">Interests</span>
          <div class="tag-chips" id="chips-interests">
            <button class="tag-chip" data-group="interests" data-val="美容護膚" data-langkey="chip_beauty" onclick="toggleChip(this)">美容護膚</button>
            <button class="tag-chip" data-group="interests" data-val="健康養生" data-langkey="chip_health" onclick="toggleChip(this)">健康養生</button>
            <button class="tag-chip" data-group="interests" data-val="投資理財" data-langkey="chip_finance" onclick="toggleChip(this)">投資理財</button>
            <button class="tag-chip" data-group="interests" data-val="旅遊" data-langkey="chip_travel" onclick="toggleChip(this)">旅遊</button>
            <button class="tag-chip" data-group="interests" data-val="親子" data-langkey="chip_family" onclick="toggleChip(this)">親子</button>
            <button class="tag-chip" data-group="interests" data-val="時尚" data-langkey="chip_fashion" onclick="toggleChip(this)">時尚</button>
            <button class="tag-chip" data-group="interests" data-val="飲食" data-langkey="chip_food" onclick="toggleChip(this)">飲食</button>
            <button class="tag-chip" data-group="interests" data-val="運動健身" data-langkey="chip_fitness" onclick="toggleChip(this)">運動健身</button>
            <button class="tag-chip" data-group="interests" data-val="科技數碼" data-langkey="chip_tech" onclick="toggleChip(this)">科技數碼</button>
            <button class="tag-chip" data-group="interests" data-val="家居生活" data-langkey="chip_home" onclick="toggleChip(this)">家居生活</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="decision_label">Decision Style</span>
          <div class="tag-chips" id="chips-decision">
            <button class="tag-chip" data-group="decision" data-val="價格敏感" data-langkey="chip_price" onclick="toggleChip(this)">價格敏感</button>
            <button class="tag-chip" data-group="decision" data-val="品質導向" data-langkey="chip_quality" onclick="toggleChip(this)">品質導向</button>
            <button class="tag-chip" data-group="decision" data-val="品牌忠誠" data-langkey="chip_brand" onclick="toggleChip(this)">品牌忠誠</button>
            <button class="tag-chip" data-group="decision" data-val="口碑驅動" data-langkey="chip_wom" onclick="toggleChip(this)">口碑驅動</button>
            <button class="tag-chip" data-group="decision" data-val="衝動消費" data-langkey="chip_impulse" onclick="toggleChip(this)">衝動消費</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="painpoints_label">Pain Points</span>
          <div class="tag-chips" id="chips-painpoints">
            <button class="tag-chip" data-group="painpoints" data-val="時間不足" data-langkey="chip_time" onclick="toggleChip(this)">時間不足</button>
            <button class="tag-chip" data-group="painpoints" data-val="預算有限" data-langkey="chip_budget" onclick="toggleChip(this)">預算有限</button>
            <button class="tag-chip" data-group="painpoints" data-val="資訊過載" data-langkey="chip_info" onclick="toggleChip(this)">資訊過載</button>
            <button class="tag-chip" data-group="painpoints" data-val="唔信任品牌" data-langkey="chip_trust" onclick="toggleChip(this)">唔信任品牌</button>
            <button class="tag-chip" data-group="painpoints" data-val="選擇困難" data-langkey="chip_choice" onclick="toggleChip(this)">選擇困難</button>
            <button class="tag-chip" data-group="painpoints" data-val="缺乏動力" data-langkey="chip_motivation" onclick="toggleChip(this)">缺乏動力</button>
          </div>
        </div>

        <div class="tag-section">
          <span class="tag-section-label" data-sectionkey="behaviour_label">Platform Behaviour</span>
          <div class="tag-chips" id="chips-behaviour">
            <button class="tag-chip" data-group="behaviour" data-val="主動搜尋型" data-langkey="chip_active" onclick="toggleChip(this)">主動搜尋型</button>
            <button class="tag-chip" data-group="behaviour" data-val="被動滾動型" data-langkey="chip_passive" onclick="toggleChip(this)">被動滾動型</button>
            <button class="tag-chip" data-group="behaviour" data-val="社群互動型" data-langkey="chip_social" onclick="toggleChip(this)">社群互動型</button>
            <button class="tag-chip" data-group="behaviour" data-val="只睇唔留言" data-langkey="chip_lurker" onclick="toggleChip(this)">只睇唔留言</button>
          </div>
        </div>

        <div class="audience-summary" id="audienceSummary"></div>
      </div>
      <div class="form-group">
        <label class="label" data-key="competitors">Competitors</label>
        <textarea id="clientCompetitors" placeholder="Main competitors, e.g., Brand A, Brand B..." style="min-height: 80px; resize: vertical;"></textarea>
      </div>
      <div class="form-group">
        <label class="label" data-key="forbiddenWords">Forbidden Words</label>
        <textarea id="clientForbiddenWords" placeholder="Words to avoid, e.g., cheap, discount, sale..." style="min-height: 80px; resize: vertical;"></textarea>

function setLanguage(lang) {
  currentLang = lang;

  updateAllUI();

function updatePageTitle() {
  const titles = {
    dashboard: LANGS[currentLang].dashboard,
    clients: LANGS[currentLang].clients,
    discover: LANGS[currentLang].discover,
    generate: LANGS[currentLang].generate,
    history: LANGS[currentLang].history
  };
  const activeTab = document.querySelector('.section.active')?.id || 'dashboard';
  document.getElementById('pageTitle').textContent = titles[activeTab] || 'Dashboard';
}

function updateAllUI() {
  const t = LANGS[currentLang];

  // Nav items
  const navItems = document.querySelectorAll('.nav-item');
  const navKeys = ['dashboard','clients','discover','generate','history'];
  navItems.forEach((item, i) => { if (t[navKeys[i]]) item.textContent = t[navKeys[i]]; });

  // Labels with data-key
  document.querySelectorAll('.label[data-key]').forEach(label => {
    const key = label.getAttribute('data-key');
    const req = label.getAttribute('data-required') === 'true' ? ' *' : '';
    if (t[key]) label.textContent = t[key].toUpperCase() + req;
  });

  // Buttons
  const addBtn = document.querySelector('button[onclick="addClient()"]');
  if (addBtn) addBtn.textContent = currentClient && clients.find(c=>c.id===currentClient.id) ? t.updateClient : t.addClient;
  const genBtn = document.querySelector('button[onclick="generateContent()"]');
  if (genBtn) genBtn.textContent = t.generate;
  const topicBtn = document.querySelector('button[onclick="generateTopicSuggestions()"]');
  if (topicBtn) topicBtn.textContent = t.generateTopics;
  const backupBtn = document.querySelector('button[onclick="exportData()"]');
  if (backupBtn) backupBtn.textContent = t.backup;
  const importBtn = document.querySelector('button[onclick="importData()"]');
  if (importBtn) importBtn.textContent = t.importBtn;

  // Placeholders
  const topicInput = document.getElementById('topic');
  if (topicInput) topicInput.placeholder = t.topicPlaceholder;
  const dirInput = document.getElementById('discoverContentDirection');
  if (dirInput) dirInput.placeholder = t.contentDirectionPlaceholder;

  // Select first options
  const sc = document.getElementById('selectClient');
  if (sc && sc.options[0]) sc.options[0].textContent = t.chooseClient;
  const dsc = document.getElementById('discoverSelectClient');
  if (dsc && dsc.options[0]) dsc.options[0].textContent = t.chooseClient;

  // Stat labels
  const cl = document.getElementById('clientCount');
  const ct = document.getElementById('contentCount');
  if (cl) cl.nextElementSibling && (cl.nextElementSibling.textContent = t.clients_label);
  if (ct) ct.nextElementSibling && (ct.nextElementSibling.textContent = t.content_label);

  // Your Clients header
  const header = document.querySelector('#clients h2');
  if (header) header.textContent = t.yourClients;

  // Tag chip labels
  document.querySelectorAll('.tag-chip[data-langkey]').forEach(chip => {
    const key = chip.getAttribute('data-langkey');
    if (t[key]) chip.textContent = t[key];
  });

  // Tag section labels
  document.querySelectorAll('[data-sectionkey]').forEach(el => {
    const key = el.getAttribute('data-sectionkey');
    if (t[key]) el.textContent = t[key];
  });

  // Tone select options
  document.querySelectorAll('option[data-langkey]').forEach(opt => {
    const key = opt.getAttribute('data-langkey');
    if (t[key]) opt.textContent = t[key];
  });
}

function switchTab(tab) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(tab).classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  event.target.classList.add('active');
  updatePageTitle();
  if (tab === 'history') renderHistory();
}


// ── E6: TAG CHIP SYSTEM ──
const AUDIENCE_GROUPS = ['gender','age','lifestage','income','interests','decision','painpoints','behaviour'];

function toggleChip(el) {
  const group = el.getAttribute('data-group');
  const isSingle = ['gender','income'].includes(group);
  
  if (isSingle) {
    // Single-select groups
    document.querySelectorAll('.tag-chip[data-group="' + group + '"]').forEach(c => c.classList.remove('selected'));
  }
  el.classList.toggle('selected');
  updateAudienceSummary();
}

function getAudienceTags() {
  const tags = {};
  AUDIENCE_GROUPS.forEach(group => {
    const selected = [...document.querySelectorAll('.tag-chip[data-group="' + group + '"].selected')]
      .map(c => c.getAttribute('data-val'));
    if (selected.length > 0) tags[group] = selected;
  });
  return tags;
}

function getAudienceString() {
  const tags = getAudienceTags();
  const parts = [];
  if (tags.gender)      parts.push('Gender: ' + tags.gender.join(', '));
  if (tags.age)         parts.push('Age: ' + tags.age.join(', '));
  if (tags.lifestage)   parts.push('Life Stage: ' + tags.lifestage.join(', '));
  if (tags.income)      parts.push('Income: ' + tags.income.join(', '));
  if (tags.interests)   parts.push('Interests: ' + tags.interests.join(', '));
  if (tags.decision)    parts.push('Decision Style: ' + tags.decision.join(', '));
  if (tags.painpoints)  parts.push('Pain Points: ' + tags.painpoints.join(', '));
  if (tags.behaviour)   parts.push('Platform Behaviour: ' + tags.behaviour.join(', '));
  return parts.join(' | ');
}

function updateAudienceSummary() {
  const summary = document.getElementById('audienceSummary');
  const str = getAudienceString();
  if (str) {
    summary.textContent = '✓ ' + str;
    summary.classList.add('visible');
  } else {
    summary.classList.remove('visible');
  }
}

function loadAudienceTags(audienceObj) {
  // Clear all chips first
  document.querySelectorAll('.tag-chip').forEach(c => c.classList.remove('selected'));
  if (!audienceObj) return;
  
  Object.entries(audienceObj).forEach(([group, vals]) => {
    vals.forEach(val => {
      const chip = document.querySelector('.tag-chip[data-group="' + group + '"][data-val="' + val + '"]');
      if (chip) chip.classList.add('selected');
    });
  });
  updateAudienceSummary();
}

function addClient() {
  const name = document.getElementById('clientName').value;
  const industry = document.getElementById('clientIndustry').value;
  const tone = document.getElementById('clientTone').value;
  const brandStory = document.getElementById('clientBrandStory').value;
  const targetAudience = getAudienceString();
  const targetAudienceTags = getAudienceTags();
  const competitors = document.getElementById('clientCompetitors').value;
  const forbiddenWords = document.getElementById('clientForbiddenWords').value;
  
  if (!name) return;
  
  // Check if editing existing client
  if (currentClient && clients.find(c => c.id === currentClient.id)) {
    // Update existing client
    const clientIndex = clients.findIndex(c => c.id === currentClient.id);
    clients[clientIndex] = {
      id: currentClient.id,
      name: name,
      industry: industry,
      tone: tone,
      brandStory: brandStory,
      targetAudience: targetAudience,
      targetAudienceTags: targetAudienceTags,
      competitors: competitors,
      forbiddenWords: forbiddenWords
    };
    alert('✅ Client updated: ' + name);
  } else {
    // Add new client
    const newClient = {
      id: Date.now(),
      name: name,
      industry: industry,
      tone: tone,
      brandStory: brandStory,
      targetAudience: targetAudience,
      targetAudienceTags: targetAudienceTags,
      competitors: competitors,
      forbiddenWords: forbiddenWords
    };
    clients.push(newClient);
    currentClient = newClient;
    alert('✅ Client added: ' + name);
  }
  
  // Clear all inputs
  document.getElementById('clientName').value = '';
  document.getElementById('clientIndustry').value = '';
  document.getElementById('clientTone').value = 'professional';
  document.getElementById('clientBrandStory').value = '';
  loadAudienceTags(null);
  document.getElementById('clientCompetitors').value = '';
  document.getElementById('clientForbiddenWords').value = '';
  
  currentClient = null;
  updateClientsList();
  updateClientSelect();
  saveData();
}

function selectCurrentClient() {
  const id = parseInt(document.getElementById('selectClient').value);
  currentClient = clients.find(c => c.id === id) || null;
}

function togglePlatform(id) {
  const btn = event.target;
  if (selectedPlatforms.includes(id)) {
    selectedPlatforms = selectedPlatforms.filter(p => p !== id);
    btn.classList.remove('active');
  } else {
    selectedPlatforms.push(id);
    btn.classList.add('active');
  }
}

function updateClientsList() {
  const list = document.getElementById('clientsList');
  list.innerHTML = clients.map(c => {
    let cardHtml = '<div class="card" style="padding: 12px; border: 1px solid var(--border); border-radius: 10px; margin-bottom: 12px;">';
    cardHtml += '<div style="display: flex; justify-content: space-between; align-items: center;">';
    cardHtml += '<div onclick="selectClientById(' + c.id + ')" style="cursor:pointer; flex: 1;">';
    cardHtml += '<div style="font-weight:600; color: var(--accent-mint);">' + c.name + '</div>';
    cardHtml += '<div style="font-size:12px; color:#999; margin-top: 4px;">Tone: ' + c.tone + '</div>';
    if (c.brandStory) cardHtml += '<div style="font-size:11px; color:#BBB; margin-top: 2px;">📝 Has story</div>';
    cardHtml += '</div>';
    cardHtml += '<button onclick="editClient(' + c.id + ')" style="padding: 6px 12px; background: var(--grad); color: #0d1521; border: none; border-radius: 8px; cursor: pointer; font-size: 12px; font-weight: 600;">Edit</button>';
    cardHtml += '</div>';
    cardHtml += '</div>';
    return cardHtml;
  }).join('');
}

function selectClientById(id) {
  currentClient = clients.find(c => c.id === id);
  document.getElementById('selectClient').value = id;
}

function editClient(id) {
  const client = clients.find(c => c.id === id);
  if (!client) return;
  
  // Load client data into form
  document.getElementById('clientName').value = client.name;
  document.getElementById('clientIndustry').value = client.industry || '';
  document.getElementById('clientTone').value = client.tone;
  document.getElementById('clientBrandStory').value = client.brandStory || '';
  loadAudienceTags(client.targetAudienceTags || null);
  document.getElementById('clientCompetitors').value = client.competitors || '';
  document.getElementById('clientForbiddenWords').value = client.forbiddenWords || '';
  
  currentClient = client;
  
  // Scroll to form
  document.getElementById('clientName').focus();
  alert('Editing: ' + client.name + '\n\nUpdate and click "Add Client" to save');
}

function updateClientSelect() {
  const sel = document.getElementById('selectClient');
  const discoverSel = document.getElementById('discoverSelectClient');
  const optionsHtml = '<option value="">Choose client...</option>' + clients.map(c => '<option value="' + c.id + '">' + c.name + '</option>').join('');
  
  sel.innerHTML = optionsHtml;
  if (discoverSel) {
    discoverSel.innerHTML = optionsHtml;
  }
}

function generateTopicSuggestions() {
  const clientId = parseInt(document.getElementById('discoverSelectClient').value);
  const platform = document.getElementById('discoverPlatform').value;
  const contentDirection = document.getElementById('discoverContentDirection').value;

function parseTopicSuggestions(text) {
  const suggestions = [];
  
  // Strategy 1: Try standard [Topic N] format
  let topicBlocks = text.split(/\s*\[Topic \d+\]/i).filter(b => b.trim());
  
  // Strategy 2: Try numbered list format (1. / 1) / **1.**)
  if (topicBlocks.length < 4) {
    topicBlocks = text.split(/(?:^|\n)(?:\*{0,2})(?:\d+)[.)\]]\s*/m).filter(b => b.trim());
  }
  
  // Strategy 3: Try ### or ** heading format
  if (topicBlocks.length < 4) {
    topicBlocks = text.split(/\n#{1,3}\s+|\n\*{2}Topic/i).filter(b => b.trim());
  }

  topicBlocks.forEach((block, index) => {
    const lines = block.trim().split('\n').filter(l => l.trim());
    if (lines.length === 0) return;

    let angle = '';
    let title = '';
    let descLines = [];

    lines.forEach((line, i) => {
      const clean = line.replace(/^\*+|\*+$/g, '').trim(); // strip markdown bold
      if (/^angle[:\s]/i.test(clean))       angle = clean.replace(/^angle[:\s]*/i, '').trim();
      else if (/^title[:\s]/i.test(clean))  title = clean.replace(/^title[:\s]*/i, '').trim();
      else if (/^desc/i.test(clean))         descLines.push(clean.replace(/^desc[a-z]*[:\s]*/i, '').trim());
      else if (i === 0 && !title)            title = clean; // first line fallback = title
      else if (title && i > 0)              descLines.push(clean);
    });

    // Last resort: if still no title, use first non-empty line
    if (!title && lines.length > 0) title = lines[0].replace(/^\*+|\*+$/g, '').trim();

    // Clean title of any residual numbering
    title = title.replace(/^\d+[.)\]]\s*/, '').replace(/^\*+|\*+$/g, '').trim();

    const description = descLines.join(' ').trim();

    if (title && title.length > 2) {
      suggestions.push({
        id: 'topic_' + Date.now() + '_' + index,
        angle: angle || 'General',
        title: title,
        description: description
      });
    }
  });

  // Deduplicate by title
  const seen = new Set();
  const unique = suggestions.filter(s => {
    if (seen.has(s.title)) return false;
    seen.add(s.title);
    return true;
  });

  return unique.slice(0, 8);
}

function cleanHashtags(text) {
  return text.replace(/`#/g, '#').replace(/#([a-zA-Z0-9_]+)`/g, '#$1');
}

function parseVariations(content) {
  const variations = [];
  const parts = content.split(/\[Variation \d+\]/i);
  
  for (let i = 1; i < parts.length; i++) {
    const text = parts[i].trim();
    if (text) {
      variations.push({
        id: 'var_' + Date.now() + '_' + i,
        number: i,
        content: cleanHashtags(text),
        rating: 0,
        isBest: false
      });
    }
  }
  
  return variations.length > 0 ? variations : [{
    id: 'var_' + Date.now() + '_1',
    number: 1,
    content: cleanHashtags(content),
    rating: 0,
    isBest: false
  }];
}

// E5: THREE-LAYER PROMPT ARCHITECTURE
// Layer 1: Fixed Rules (Platform + Language + Anti-AI)
// Layer 2: Brand Rules (Client Profile)
// Layer 3: Context Triggers (Compliance + Seasonal)
// ============================================================

function buildLayer1(platforms, lang) {
  const platformRules = {

- Length: 100-200 characters (300+ for long-form)
- Style: Conversational, story-driven, warm tone

    instagram: `INSTAGRAM RULES:
- Length: 50-100 characters (caption cuts off after 125 chars)
- Style: Concise, visual-forward
- First line MUST be the strongest — it shows before "more"
- Hashtags: 8-10, placed at end
- Use line breaks between paragraphs
- Emoji: use generously for visual rhythm`,

    threads: `THREADS RULES:
- Length: Under 80 characters per post (can thread)
- Style: Extremely casual, like talking to a friend
- Opinion-driven, thought-provoking, sparks discussion
- Hashtags: 0-3 max
- Fragments are OK. Open-ended is better than concluded.`,

    linkedin: `LINKEDIN RULES:
- Length: 150-250 characters
- Style: Professional, insightful, thought leadership
- Format: Clear paragraphs, bullet points work well
- Hashtags: 3-5 precise ones
- MUST end with a question to drive comments
- No pure sales language, no fake inspirational stories`,

    xiaohongshu: `XIAOHONGSHU (RED) RULES:
- Length: 150-250 characters
- Title: MUST use【】brackets e.g.【這個方法真的有效！】
- Style: Real-life feel, like sharing with a friend
- Hashtags: 8-15, mix Chinese and English, placed at end or between paragraphs
- Emoji after every key point
- MUST use Mainland Chinese grammar — NO Hong Kong expressions (冇、靠、得啦)
- Format: Clear paragraphs, max 2-3 sentences each`,

    wechat: `WECHAT MOMENTS RULES:
- Length: 80-150 characters
- Style: Warm, personal, like a real friend sharing
- NO hashtags (WeChat Moments has no hashtag function)
- First person voice, genuine feel
- End with a soft question to invite comments (e.g. 你呢？)
- Natural paragraphs — NO bullet points
- Emoji: use sparingly and naturally`
  };

  const langRules = {
    tc: `LANGUAGE: Traditional Chinese (Hong Kong)
- Adjust style to brand tone:
  - Professional/Educational: Written form (書面語): 「我們提供…」「協助您…」
  - Casual/Energetic: HK colloquial: 「搞掂！」「係咁先！」「得唔得呀？」
  - Luxury: Elegant written form: 「臻選」「尊享」「精粹」
- NEVER mix written and colloquial in same piece
- Avoid Taiwan expressions: 棒、哦、超級、讚 (use: 正、好、非常、好鐘意)`,

    sc: `LANGUAGE: Simplified Chinese (Mainland)
- This is NOT just font conversion — it is a GRAMMAR and TONE conversion
- Use genuine Mainland expressions and vocabulary
- Sound native to XiaoHongShu and WeChat
- COMPLETELY AVOID: HK expressions (冇、靠、得唔得、係咁先), Taiwan expressions (棒、讚)
- Use: 很棒 not 好正 | 没问题 not 冇問題 | 试试看 not 試吓 | 非常喜欢 not 好鐘意`,

    en: `LANGUAGE: English (Hong Kong English standard)
- British spelling: colour, organisation, realise
- Tone varies by platform (LinkedIn = professional, Threads = casual fragments)
- AVOID American corporate jargon: leverage, synergise, paradigm shift, game-changer
- AVOID AI clichés: "I'm thrilled to share", "In today's world", "Unlock your potential"
- Keep it direct, clear, approachable — real person talking, not corporate memo`
  };

  const antiAI = `
ANTI-AI WRITING RULES (CRITICAL — apply to every variation):
- Write like a real human, NOT a corporate announcement
- Vary sentence length — short punchy sentences mixed with longer ones
- Include specific details (names, places, times) not vague descriptions
- Show emotion and personality — not mechanical statements
- FORBIDDEN AI phrases: "In conclusion", "It is worth noting", "Dive into", "Game-changer", 
  "Unlock your potential", "In today's rapidly evolving", "I'm thrilled to share",
  "Without further ado", "At the end of the day", "Thank you for reading"
- Instead: Start with a story, a question, a specific moment, or a bold opinion
- Add dialogue where possible ("My client asked me...")
- Reference specific times ("Last week", "Yesterday", "3 months ago")`;

  const selectedPlatformRules = platforms
    .filter(p => platformRules[p])
    .map(p => platformRules[p])
    .join('\n\n');

  return `=== LAYER 1: PLATFORM & LANGUAGE RULES ===
${selectedPlatformRules}

${langRules[lang] || langRules['en']}
${antiAI}`;
}

function buildLayer2(client) {

  layer += `
Brand Tone: ${toneDescriptions[client.tone] || client.tone}`;

function buildLayer3(platforms, topic, industry, lang) {
  let triggers = [];

  // Trigger: Mainland platforms compliance
  const mainlandPlatforms = platforms.filter(p => p === 'xiaohongshu' || p === 'wechat');
  if (mainlandPlatforms.length > 0) {
    triggers.push(`CHINA ADVERTISING LAW COMPLIANCE (for ${mainlandPlatforms.join(', ')}):
COMPLETELY FORBIDDEN superlatives: 最優、最好、最佳、最強、第一、唯一、獨一無二、頂級、極致、100%、絕對、完全、革命性、顛覆性
Replace with: 優質、出色、卓越、備受好評、業界認可、創新方案
FORBIDDEN exaggeration: 火爆全港、瘋搶、秒空、不買就後悔
FORBIDDEN false urgency: 限時特惠 (unless genuinely time-limited)
Content must be EDUCATIONAL in angle, not pure sales`);
  }

  // Trigger: Financial industry
  const financialIndustries = ['finance', 'insurance', 'banking', 'investment'];
  if (industry && financialIndustries.some(f => industry.toLowerCase().includes(f))) {
    triggers.push(`FINANCIAL CONTENT COMPLIANCE:
ABSOLUTELY FORBIDDEN: 保本、保息、穩賺、必賺、無風險、零風險、保證收益、確保回報、躺賺
Replace with: 具保障成分、歷史表現參考、具增值潛力、風險相對較低
If mentioning specific returns (%), MUST add: 「投資涉及風險，過去表現不代表未來」
Content must be EDUCATIONAL — build trust, do not hard-sell products
No specific client testimonials with monetary amounts`);
  }

  // Trigger: Seasonal detection
  const topicLower = topic.toLowerCase();
  const now = new Date();
  const month = now.getMonth() + 1;
  
  const seasonalHooks = {
    'christmas': '🎄 Christmas seasonal angle — gift-giving, year-end gratitude, family warmth',
    'new year': '🎊 New Year angle — fresh start, resolutions, reflection on the past year',
    '新年': '🧧 Chinese New Year angle — reunion, prosperity, family, new beginnings (農曆新年)',
    '聖誕': '🎄 Christmas angle — gift ideas, year-end warmth, festive spirit',
    'summer': '☀️ Summer angle — heat, holidays, refreshing moments, energy',
    "valentine": "💕 Valentine's Day angle — love, appreciation, connection",
    "mother": "💐 Mother's Day angle — appreciation, family bond, heartfelt gratitude",
    "mid-autumn": "🥮 Mid-Autumn Festival — reunion, mooncakes, family traditions (中秋節)",
    '中秋': '🥮 Mid-Autumn Festival angle — reunion, mooncakes, lanterns, family',
    "dragon boat": "🐉 Dragon Boat Festival angle — tradition, strength, community (端午節)",
    '端午': '🐉 Dragon Boat Festival angle — 粽子, tradition, family gathering'
  };

  for (const [keyword, hook] of Object.entries(seasonalHooks)) {
    if (topicLower.includes(keyword)) {
      triggers.push(`SEASONAL CONTEXT: ${hook}
Weave this seasonal angle naturally into the content`);
      break;
    }
  }

  // Month-based seasonal triggers
  if (month === 1 || month === 2) triggers.push('SEASONAL: Chinese New Year period — prosperity, fresh starts, family reunion themes resonate strongly');
  if (month === 12) triggers.push('SEASONAL: Year-end period — reflection, gratitude, Christmas, holiday giving themes resonate strongly');
  if (month === 6 || month === 7 || month === 8) triggers.push('SEASONAL: Summer period — energy, holidays, refreshment themes resonate strongly');

  if (triggers.length === 0) return '';

  return `=== LAYER 3: CONTEXT TRIGGERS ===
${triggers.join('\n\n')}`;
}

${layer2}

${layer3 ? layer3 + `\n\n` : ''}=== CONTENT GENERATION TASK ===
Topic: "${topic}"
Platforms: ${selectedPlatforms.join(', ')}
Output Language: ${languageMap[contentLang]}

Generate 5 distinct content variations for this topic. Each variation should:

Format each variation with [Variation 1], [Variation 2], [Variation 3], [Variation 4], [Variation 5]

  console.log('3-Layer Prompt built. Layers:', layer1.length, layer2.length, layer3.length);

function renderVariations() {

    div.innerHTML = '<p>No content generated yet</p>';

  }
  
  const visibleVariations = generatedVariations.slice(0, 6);
  
  let html = '<div class="generated-container">';

  // Add cards
  visibleVariations.forEach(v => {
    html += '<div class="variation-card">';

    html += '<div class="variation-title" style="margin-bottom:0;">Variation ' + v.number + '</div>';

    html += '</div>';
    html += '<div class="variation-content">' + v.content + '</div>';
    html += '<div class="rating">';
    for (let i = 1; i <= 5; i++) {
      const starClass = i <= v.rating ? ' active' : '';
      html += '<span class="star' + starClass + '" onclick="rateVariation(\'' + v.id + '\', ' + i + ')">' + (i <= v.rating ? '★' : '☆') + '</span>';
    }
    html += '</div>';
    if (v.isBest) {
      html += '<div class="best-badge">✓ Best</div>';
    }
    html += '</div>';
  });
  
  html += '</div>';
  
  div.innerHTML = html;
  console.log('Rendered variations:', visibleVariations.length);

function copyVariation(varId, btn) {
  const variation = generatedVariations.find(v => v.id === varId);
  if (!variation) return;
  
  navigator.clipboard.writeText(variation.content).then(() => {
    const original = btn.textContent;
    btn.textContent = 'Copied ✓';
    btn.style.borderColor = 'rgba(205,255,216,0.4)';
    btn.style.color = '#cdffd8';
    setTimeout(() => {
      btn.textContent = original;
      btn.style.borderColor = 'rgba(255,255,255,0.15)';
      btn.style.color = 'rgba(255,255,255,0.6)';
    }, 2000);
  }).catch(() => {
    // Fallback for older browsers
    const ta = document.createElement('textarea');
    ta.value = variation.content;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = 'Copied ✓';
    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
  });
}

function rateVariation(varId, rating) {
  const variation = generatedVariations.find(v => v.id === varId);
  if (variation) {
    variation.rating = rating;
    variation.isBest = rating >= 4;
    renderVariations();
    saveData();
  }
}

function updateStats() {
  document.getElementById('clientCount').textContent = clients.length;
  document.getElementById('contentCount').textContent = history.length;
}

function renderHistory() {
  const div = document.getElementById('historyList');
  if (!history || history.length === 0) {
    div.innerHTML = '<div style="color: var(--secondary); text-align: center; padding: 48px 0; font-size: 14px;">No content generated yet.</div>';
    return;
  }

  // Sort newest first
  const sorted = [...history].reverse();
  let html = '';

  sorted.forEach(entry => {
    const client = clients.find(c => c.id === entry.clientId);
    const clientName = client ? client.name : 'Unknown Client';
    const date = new Date(entry.createdAt).toLocaleDateString('zh-HK', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    const platforms = (entry.platforms || []).join(', ').toUpperCase();
    const bestVar = entry.variations ? entry.variations.find(v => v.isBest) : null;
    const topVar = entry.variations ? entry.variations[0] : null;
    const preview = (bestVar || topVar) ? (bestVar || topVar).content.substring(0, 120) + '...' : '';

    html += '<div class="card" style="margin-bottom: 16px; padding: 16px; cursor: pointer;" onclick="loadHistoryEntry(' + entry.id + ')">';
    html += '<div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 10px;">';
    html += '<div>';
    html += '<div style="font-weight:600; color: var(--accent-mint); margin-bottom: 4px;">' + (entry.topic || 'Untitled') + '</div>';
    html += '<div style="font-size:11px; color: var(--muted);">' + clientName + ' · ' + platforms + ' · ' + date + '</div>';
    html += '</div>';
    if (bestVar) html += '<div style="font-size:10px; color: var(--accent-mint); font-weight:600; letter-spacing:0.08em;">★ BEST</div>';
    html += '</div>';
    if (preview) html += '<div style="font-size: 12px; color: var(--secondary); line-height: 1.5;">' + preview + '</div>';
    html += '<div style="font-size:11px; color: var(--muted); margin-top: 10px;">' + (entry.variations ? entry.variations.length : 0) + ' variations</div>';
    html += '</div>';
  });

  div.innerHTML = html;
}

function loadHistoryEntry(entryId) {
  const entry = history.find(e => e.id === entryId);
  if (!entry) return;

  // Switch to generate tab and load content
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('generate').classList.add('active');
  document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
  document.querySelectorAll('.nav-item')[3].classList.add('active');

  // Set client
  if (entry.clientId) {
    document.getElementById('selectClient').value = entry.clientId;
    selectCurrentClient();
  }

  // Set platforms
  selectedPlatforms = entry.platforms || [];
  document.querySelectorAll('.platform-btn').forEach(btn => btn.classList.remove('active'));
  selectedPlatforms.forEach(p => {
    const btn = document.querySelector('.platform-btn[onclick*="' + p + '"]');
    if (btn) btn.classList.add('active');
  });

  // Load variations
  generatedVariations = entry.variations || [];
  renderVariations();

  document.getElementById('pageTitle').textContent = LANGS[currentLang].history || 'History';
}

function saveData() {
  localStorage.setItem('flux_data', JSON.stringify({ clients: clients, history: history, currentLang: currentLang }));
}

function loadData() {
  const saved = localStorage.getItem('flux_data');
  if (saved) {
    const data = JSON.parse(saved);
    clients = data.clients || [];
    history = data.history || [];
    currentLang = data.currentLang || 'tc';
    updateClientsList();
    updateClientSelect();
    updateStats();
  }
}



function exportData() {
  const data = { clients: clients, history: history };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'flux-backup-' + new Date().toISOString().split('T')[0] + '.json';
  a.click();
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    const reader = new FileReader();
    reader.onload = function(evt) {
      try {
        const data = JSON.parse(evt.target.result);
        clients = data.clients || [];
        history = data.history || [];
        saveData();
        updateClientsList();
        updateClientSelect();
        updateStats();
        alert('Data imported!');
      } catch (err) {
        alert('Invalid JSON');
      }
    };
    reader.readAsText(e.target.files[0]);
  };
  input.click();
}

window.addEventListener('load', function() {
  loadData();
  updateAllUI();

  // Keep Render backend alive — ping every 10 minutes
  function pingBackend() {
    fetch('https://flux-content-engine.onrender.com/ping')
      .then(r => r.json())
      .then(d => console.log('Backend alive:', d.time))
      .catch(() => console.log('Backend ping failed — may be waking up'));
  }
  pingBackend(); // ping immediately on load
  setInterval(pingBackend, 10 * 60 * 1000); // then every 10 mins
});
</script>
